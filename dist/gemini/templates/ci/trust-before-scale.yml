name: Trust before scale
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tbs/*.test.mjs
      - run: node scripts/tbs/feature-map.mjs
      - run: node scripts/tbs/skill-eval.mjs --check
      - run: node scripts/tbs/doctor.mjs --ci
