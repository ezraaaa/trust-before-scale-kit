name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract version notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line === `## ${version}` || line.startsWith(`## ${version} `) || line.startsWith(`## [${version}]`));
          if (start < 0) throw new Error(`No CHANGELOG section for ${version}`);
          const next = lines.findIndex((line, i) => i > start && /^## /.test(line));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`Empty CHANGELOG section for ${version}`);
          writeFileSync('release-notes.md', notes + '\n');
          JS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
